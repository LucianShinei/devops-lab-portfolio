services:

  mysql:
    image: mysql:8.4
    container_name: retail-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: retaildb
      MYSQL_USER: retailuser
      MYSQL_PASSWORD: retailpass
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - retail-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

    # No host port is published for MySQL.

  redis:
    image: redis:7-alpine
    container_name: retail-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - retail-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

    # No host port is published for Redis.

  app:
    build: .
    container_name: retail-app
    ports:
      - "5001:5000"
    environment:
      DB_HOST: mysql
      DB_USER: retailuser
      DB_PASSWORD: retailpass
      DB_NAME: retaildb
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - retail-net
    mem_limit: 512m
    cpus: 0.50
    restart: unless-stopped

    # Add this only after loading the custom profile on a supported
    # Linux Docker Engine:
    # security_opt:
    #   - apparmor=retail-python

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: retail-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - retail-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: retail-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cadvisor
    networks:
      - retail-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: retail-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - retail-net
    restart: unless-stopped


networks:
  retail-net:
    name: retail-net
    driver: bridge


volumes:
  mysql-data:
  redis-data:
  grafana-data: